  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Work Finder - Admin</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#e2e8f0;color:#0f172a;font-family:Arial,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.app{max-width:650px;min-height:100vh;margin:auto;background:#f8fafc}
.header{background:#0f172a;color:white;padding:17px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:20px;font-weight:bold}
.header button{background:#1e293b;color:white;border:0;border-radius:8px;padding:10px}
main{padding:14px}
h2{font-size:19px;margin:8px 0 15px}
h3{font-size:15px}
.muted{color:#64748b;font-size:13px;line-height:1.6}
.login{margin:30px auto;background:white;padding:22px;border:1px solid #e2e8f0;border-radius:14px}
.login input{display:block;width:100%;padding:13px;margin:12px 0;border:1px solid #cbd5e1;border-radius:8px}
.primary,.approve,.reject{border:0;border-radius:8px;padding:12px;color:white;font-weight:bold}
.primary{background:#0f172a;width:100%}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:18px}
.tab{background:white;border:1px solid #cbd5e1;border-radius:10px;padding:12px 4px;color:#334155;font-size:13px;font-weight:bold}
.tab.active{background:#0f172a;color:white;border-color:#0f172a}
.count{display:inline-block;min-width:21px;padding:3px 5px;margin-left:3px;border-radius:20px;background:#ef4444;color:white}
.tab.active .count{background:white;color:#0f172a}
.job{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:15px;margin-bottom:14px;box-shadow:0 4px 12px #0f172a0b}
.jobTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.jobTitle{font-size:19px;font-weight:bold;overflow-wrap:anywhere}
.company{color:#475569;font-size:14px;margin-top:7px}
.salary{font-size:19px;font-weight:bold;color:#16a34a;margin:12px 0}
.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold;white-space:nowrap}
.pending{background:#fef3c7;color:#92400e}
.approved{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}
.info{font-size:14px;line-height:1.6;color:#334155;margin:8px 0;overflow-wrap:anywhere}
.info b{color:#0f172a}
.description{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;color:#475569;margin-top:10px}
hr{border:0;border-top:1px solid #e2e8f0;margin:13px 0}
.buttons{display:flex;gap:9px;margin-top:15px}
.buttons button{flex:1}
.approve{background:#16a34a}
.reject{background:#dc2626}
.empty{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:30px 15px;text-align:center;color:#64748b;line-height:1.7}
#error{color:#dc2626;overflow-wrap:anywhere;font-size:13px}
.forgot-wrap{text-align:center;margin-top:14px}
.forgot-btn{background:transparent;border:0;color:#2563eb;text-decoration:underline;padding:8px;font-size:14px}
#notice{padding:11px;border-radius:8px;background:#e0f2fe;color:#075985;margin-bottom:12px;font-size:13px;display:none;overflow-wrap:anywhere}
.footer{text-align:center;padding:22px;color:#94a3b8;font-size:12px}
[hidden]{display:none!important}
@media(max-width:360px){main{padding:10px}.job{padding:12px}.jobTitle{font-size:17px}.tab{font-size:12px}}
</style>
</head>

<body>
<div class="app">

<header class="header">
  <div class="logo"><i class="fa-solid fa-briefcase"></i> Work Finder Admin</div>
  <button id="logoutBtn" hidden>
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</header>

<main>
  <section id="loginSection" class="login">
    <h2>Admin Login</h2>
    <p class="muted">Sirf authorized administrator login kar sakta hai.</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="primary" id="loginBtn" type="submit">Login</button>
    </form>
    <div class="forgot-wrap">
      <button type="button" class="forgot-btn" id="forgotPasswordBtn">Forgot Password?</button>
    </div>
    <p id="error" role="alert" aria-live="polite"></p>
  </section>

  <section id="dashboard" hidden>
    <h2>Job Approval Dashboard</h2>
    <p class="muted">New jobs aur HR edit requests check karo.</p>

    <div id="notice" role="status" aria-live="polite"></div>

    <nav class="tabs">
      <button class="tab active" data-section="pending">
        Pending <span class="count" id="pendingCount">0</span>
      </button>
      <button class="tab" data-section="approved">
        Approved <span id="approvedCount">0</span>
      </button>
      <button class="tab" data-section="rejected">
        Rejected <span id="rejectedCount">0</span>
      </button>
    </nav>

    <div id="sectionTitle"><h2>Pending Jobs & Edit Requests</h2></div>
    <div id="jobs"><div class="empty">Loading jobs...</div></div>
  </section>
</main>

<footer class="footer">Work Finder · Admin Panel</footer>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore, collection, doc, updateDoc, onSnapshot,
  serverTimestamp, writeBatch, deleteField
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCBMrDXwhV8-2kz-FaMTYmLEODXRGNAdU",
  authDomain: "workfinder2-a5f80.firebaseapp.com",
  projectId: "workfinder2-a5f80"
};

// PERSONAL ADMIN UID — UNCHANGED
const ADMIN_UID = "fk9WiZisFfTKwo9YAZbqUsUegTI3";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const loginSection = document.getElementById("loginSection");
const dashboard = document.getElementById("dashboard");
const loginForm = document.getElementById("loginForm");
const errorBox = document.getElementById("error");
const jobsBox = document.getElementById("jobs");
const notice = document.getElementById("notice");
const logoutBtn = document.getElementById("logoutBtn");
const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");
const loginBtn = document.getElementById("loginBtn");

let jobs = [];
let editRequests = [];
let currentSection = "pending";
let unsubscribeJobs = null;
let unsubscribeRequests = null;
let busy = false;

// Fields an HR is allowed to propose for an edit.
// Keep this list consistent with the HR dashboard and Firestore Rules.
const ALLOWED_EDIT_FIELDS = new Set([
  "Job Title",
  "Company Name",
  "Salary",
  "Job Type",
  "State",
  "City",
  "Area",
  "Landmark",
  "Job Description",
  "Contact Number",
  "WhatsApp",
  "Email",
  "Work Type",
  "Working Mode",
  "Working Shifts",
  "Gender",
  "Education",
  "Experience",
  "Plan",
  "duration",
  "priority",
  "Expiry Date",
  "Active/Inactive"
]);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function field(object, ...names) {
  for (const name of names) {
    const value = object?.[name];
    if (value !== undefined && value !== null &&
        String(value).trim() !== "") {
      return String(value).trim();
    }
  }
  return "";
}

function statusOf(job) {
  const status = field(job, "status").toLowerCase();
  if (["approved", "yes"].includes(status)) return "approved";
  if (status === "rejected") return "rejected";
  return "pending";
}

function displayValue(value) {
  if (value === null || value === undefined) return "";
  if (typeof value?.toDate === "function") {
    return value.toDate().toLocaleString();
  }
  if (typeof value === "object") return JSON.stringify(value);
  return String(value);
}

function labelOf(key) {
  return key.replace(/([a-z])([A-Z])/g, "$1 $2")
    .replace(/[_-]/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

function showNotice(message) {
  notice.textContent = message;
  notice.style.display = "block";
}

function hideNotice() {
  notice.style.display = "none";
}

function stopListeners() {
  if (unsubscribeJobs) unsubscribeJobs();
  if (unsubscribeRequests) unsubscribeRequests();

  unsubscribeJobs = null;
  unsubscribeRequests = null;
  jobs = [];
  editRequests = [];
}

function setCounts() {
  const pendingJobs = jobs.filter(item =>
    statusOf(item.data) === "pending"
  ).length;

  const pendingEdits = editRequests.filter(item =>
    item.data.status === "pending"
  ).length;

  const approvedJobs = jobs.filter(item =>
    statusOf(item.data) === "approved" &&
    item.data.editPending !== true
  ).length;

  const rejectedJobs = jobs.filter(item =>
    statusOf(item.data) === "rejected"
  ).length;

  document.getElementById("pendingCount").textContent =
    pendingJobs + pendingEdits;
  document.getElementById("approvedCount").textContent = approvedJobs;
  document.getElementById("rejectedCount").textContent = rejectedJobs;
}

function makeCard(item) {
  const job = item.data;
  const id = item.id;
  const status = statusOf(job);

  const title = field(job, "Job Title", "JobTitle", "title")
    || "Job Vacancy";
  const company = field(job, "Company Name", "CompanyName", "company")
    || "Company not specified";
  const salary = field(job, "Salary", "salary") || "Not Disclosed";

  const location = [
    field(job, "Area", "area"),
    field(job, "City", "city"),
    field(job, "State", "state")
  ].filter(Boolean).join(", ") || "Not specified";

  const internalFields = new Set([
    "editPending", "pendingEditRequestId", "reviewedAt", "hrUid"
  ]);

  const known = new Set([
    "Job Title", "JobTitle", "title",
    "Company Name", "CompanyName", "company",
    "Salary", "salary", "status", ...internalFields
  ]);

  const extraFields = Object.entries(job)
    .filter(([key]) => !known.has(key))
    .map(([key, value]) => `
      <div class="info"><b>${esc(labelOf(key))}:</b>
        ${esc(displayValue(value) || "-")}
      </div>`).join("");

  const actionButtons =
    status === "pending" && job.editPending !== true
      ? `<div class="buttons">
          <button class="approve" data-action="approve" data-id="${esc(id)}">
            <i class="fa-solid fa-check"></i> Approve
          </button>
          <button class="reject" data-action="reject" data-id="${esc(id)}">
            <i class="fa-solid fa-xmark"></i> Reject
          </button>
        </div>`
      : "";

  const editWaiting = job.editPending === true
    ? `<p class="muted">An edit request is pending. Review the linked request below.</p>`
    : "";

  return `
  <article class="job">
    <div class="jobTop">
      <div class="jobTitle">${esc(title)}</div>
      <span class="status ${status}">${esc(status.toUpperCase())}</span>
    </div>
    <div class="company"><i class="fa-regular fa-building"></i> ${esc(company)}</div>
    <div class="salary">₹ ${esc(salary)}</div>

    <div class="info"><b>Job Type:</b> ${esc(field(job,"Job Type","JobType") || "-")}</div>
    <div class="info"><b>Location:</b> ${esc(location)}</div>
    <div class="info"><b>Landmark:</b> ${esc(field(job,"Landmark","landmark") || "-")}</div>

    <hr>
    <div class="info"><b>Work Type:</b> ${esc(field(job,"Work Type","WorkType") || "-")}</div>
    <div class="info"><b>Working Mode:</b> ${esc(field(job,"Working Mode","WorkingMode") || "-")}</div>
    <div class="info"><b>Working Shifts:</b> ${esc(field(job,"Working Shifts","WorkingShifts") || "-")}</div>
    <div class="info"><b>Gender:</b> ${esc(field(job,"Gender","gender") || "-")}</div>
    <div class="info"><b>Education:</b> ${esc(field(job,"Education","education") || "-")}</div>
    <div class="info"><b>Experience:</b> ${esc(field(job,"Experience","experience") || "-")}</div>

    <div class="description"><b>Job Description:</b>
${esc(field(job,"Job Description","JobDescription","description") || "No description provided.")}</div>

    <hr>
    <div class="info"><b>Contact Number:</b> ${esc(field(job,"Contact Number","ContactNumber","phone") || "-")}</div>
    <div class="info"><b>WhatsApp:</b> ${esc(field(job,"WhatsApp","Whatsapp","whatsapp") || "-")}</div>
    <div class="info"><b>Email:</b> ${esc(field(job,"Email","email") || "-")}</div>

    ${extraFields ? `<hr><h3>Other Job Details</h3>${extraFields}` : ""}
    ${editWaiting}
    ${actionButtons}
  </article>`;
}

function makeEditRequestCard(item) {
  const request = item.data;
  const id = item.id;

  const original = jobs.find(job => job.id === request.originalJobId);
  const originalTitle = original
    ? field(original.data, "Job Title", "JobTitle", "title")
    : "Original job not found";

  const changes = request.proposedChanges || {};

  const changesHtml = Object.entries(changes).map(([key, value]) => `
    <div class="info">
      <b>${esc(labelOf(key))}:</b> ${esc(displayValue(value) || "-")}
    </div>`).join("");

  const validLink = !!original &&
    original.data.hrUid === request.hrUid &&
    original.data.status === "approved" &&
    original.data.editPending === true &&
    original.data.pendingEditRequestId === id &&
    request.status === "pending";

  return `
    <article class="job">
      <div class="jobTop">
        <div class="jobTitle">Job Edit Request</div>
        <span class="status pending">PENDING EDIT</span>
      </div>

      <div class="info"><b>Original Job:</b> ${esc(originalTitle)}</div>
      <div class="info"><b>Job ID:</b> ${esc(request.originalJobId || "-")}</div>
      <div class="info"><b>HR UID:</b> ${esc(request.hrUid || "-")}</div>

      <hr>
      <h3>Proposed Changes</h3>
      ${changesHtml || '<p class="muted">No changes supplied.</p>'}

      ${!validLink ? `
        <p class="info" style="color:#b91c1c">
          Job/request verification failed. Do not approve this request.
        </p>
      ` : `
        <div class="buttons">
          <button class="approve" data-action="approve-edit" data-id="${esc(id)}">
            <i class="fa-solid fa-check"></i> Approve Edit
          </button>
          <button class="reject" data-action="reject-edit" data-id="${esc(id)}">
            <i class="fa-solid fa-xmark"></i> Reject Edit
          </button>
        </div>
      `}
    </article>`;
}

function renderJobs() {
  setCounts();

  document.getElementById("sectionTitle").innerHTML =
    `<h2>${labelOf(currentSection)} ${currentSection === "pending" ? "Jobs & Edit Requests" : "Jobs"}</h2>`;

  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle("active", button.dataset.section === currentSection);
  });

  let visibleJobs = jobs.filter(item => {
    const status = statusOf(item.data);
    if (currentSection === "approved") {
      return status === "approved" && item.data.editPending !== true;
    }
    return status === currentSection;
  });

  const visibleEdits = currentSection === "pending"
    ? editRequests.filter(item => item.data.status === "pending")
    : [];

  if (!visibleJobs.length && !visibleEdits.length) {
    jobsBox.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-briefcase" style="font-size:25px"></i>
        <p>No ${esc(currentSection)} jobs or requests found.</p>
      </div>`;
    return;
  }

  jobsBox.innerHTML =
    visibleJobs.map(makeCard).join("") +
    visibleEdits.map(makeEditRequestCard).join("");
}

function startJobsListener() {
  if (unsubscribeJobs) unsubscribeJobs();
  if (unsubscribeRequests) unsubscribeRequests();

  jobsBox.innerHTML = '<div class="empty">Loading jobs...</div>';

  unsubscribeJobs = onSnapshot(
    collection(db, "jobs"),
    snapshot => {
      jobs = snapshot.docs.map(d => ({id:d.id, data:d.data()}));
      renderJobs();
    },
    error => {
      console.error("Jobs listener:", error);
      showNotice("Jobs load nahi hui: " + (error.code || error.message));
    }
  );

  unsubscribeRequests = onSnapshot(
    collection(db, "jobEditRequests"),
    snapshot => {
      editRequests = snapshot.docs.map(d => ({id:d.id, data:d.data()}));
      renderJobs();
    },
    error => {
      console.error("Edit requests listener:", error);
      showNotice("Edit requests load nahi hui: " + (error.code || error.message));
    }
  );
}

async function changeStatus(id, nextStatus) {
  if (busy) return;

  if (!["approved", "rejected"].includes(nextStatus)) return;

  const item = jobs.find(job => job.id === id);

  if (!item || statusOf(item.data) !== "pending") {
    showNotice("Yeh job ab Pending mein nahi hai.");
    return;
  }

  if (item.data.editPending === true) {
    showNotice("Is job par edit request pending hai. Pehle request review karo.");
    return;
  }

  const title = field(item.data, "Job Title", "JobTitle", "title") || "this job";

  if (!confirm(nextStatus === "approved"
    ? `Approve "${title}"?`
    : `Reject "${title}"?`)) return;

  busy = true;

  try {
    await updateDoc(doc(db, "jobs", id), {
      status: nextStatus,
      reviewedAt: serverTimestamp()
    });

    showNotice(`Job ${nextStatus} successfully.`);
  } catch (error) {
    console.error(error);
    showNotice("Update failed: " + (error.code || error.message));
  } finally {
    busy = false;
    renderJobs();
  }
}

async function changeEditRequest(id, nextStatus) {
  if (busy) return;

  if (!["approved", "rejected"].includes(nextStatus)) {
    showNotice("Invalid request status.");
    return;
  }

  const item = editRequests.find(request => request.id === id);

  if (!item || item.data.status !== "pending") {
    showNotice("Edit request ab pending nahi hai.");
    return;
  }

  const request = item.data;
  const original = jobs.find(job => job.id === request.originalJobId);

  if (!original) {
    showNotice("Original job nahi mili. Request manually check karo.");
    return;
  }

  const job = original.data;

  // Verify the linked request and original job before any action.
  if (
    !request.hrUid ||
    job.hrUid !== request.hrUid ||
    job.status !== "approved" ||
    job.editPending !== true ||
    job.pendingEditRequestId !== id
  ) {
    showNotice("Ownership/link verification failed. Action cancelled.");
    return;
  }

  const isApprove = nextStatus === "approved";

  if (!confirm(isApprove
    ? "Edit approve karke proposed changes apply karne hain?"
    : "Edit reject karni hai? Purani approved job unchanged rahegi.")) {
    return;
  }

  busy = true;

  try {
    const changes = request.proposedChanges;

    if (
      !changes ||
      typeof changes !== "object" ||
      Array.isArray(changes)
    ) {
      throw new Error("Invalid proposedChanges data.");
    }

    const safeChanges = {};

    if (isApprove) {
      const keys = Object.keys(changes);

      if (keys.length === 0) {
        throw new Error("Request mein koi proposed change nahi hai.");
      }

      for (const [key, value] of Object.entries(changes)) {
        if (!ALLOWED_EDIT_FIELDS.has(key)) {
          throw new Error("Field change allowed nahi hai: " + key);
        }

        if (
          value === undefined ||
          (typeof value !== "string" &&
           typeof value !== "number" &&
           typeof value !== "boolean")
        ) {
          throw new Error("Invalid value for field: " + key);
        }

        if (typeof value === "string" && value.length > 10000) {
          throw new Error("Field value bahut lambi hai: " + key);
        }

        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new Error("Invalid numeric value for: " + key);
        }

        safeChanges[key] = value;
      }
    }

    const batch = writeBatch(db);
    const jobRef = doc(db, "jobs", request.originalJobId);
    const requestRef = doc(db, "jobEditRequests", id);

    if (isApprove) {
      // Apply only validated changes. Keep ownership and approval state.
      batch.update(jobRef, {
        ...safeChanges,
        status: "approved",
        editPending: false,
        pendingEditRequestId: deleteField(),
        reviewedAt: serverTimestamp()
      });
    } else {
      // IMPORTANT: do not change the original job's approved status.
      // Only clear the edit lock; original details remain unchanged.
      batch.update(jobRef, {
        editPending: false,
        pendingEditRequestId: deleteField()
      });
    }

    // Update the request and job atomically.
    batch.update(requestRef, {
      status: nextStatus,
      reviewedAt: serverTimestamp()
    });

    await batch.commit();

    showNotice(isApprove
      ? "Edit approved. Updated job details saved."
      : "Edit rejected. Original approved job remains unchanged.");
  } catch (error) {
    console.error("Edit review failed:", error);
    showNotice("Request update failed: " + (error.code || error.message));
  } finally {
    busy = false;
    renderJobs();
  }
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    currentSection = button.dataset.section;
    renderJobs();
    window.scrollTo({top:0, behavior:"smooth"});
  });
});

jobsBox.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button || busy) return;

  const action = button.dataset.action;
  const id = button.dataset.id;

  if (action === "approve" || action === "reject") {
    changeStatus(id, action === "approve" ? "approved" : "rejected");
  }

  if (action === "approve-edit" || action === "reject-edit") {
    changeEditRequest(id, action === "approve-edit" ? "approved" : "rejected");
  }
});

forgotPasswordBtn.addEventListener("click", async () => {
  errorBox.textContent = "";

  const email = document.getElementById("email").value.trim();

  if (!email) {
    errorBox.textContent = "Pehle Admin email enter karo, phir Forgot Password dabao.";
    document.getElementById("email").focus();
    return;
  }

  forgotPasswordBtn.disabled = true;
  forgotPasswordBtn.textContent = "Sending reset email...";

  try {
    await sendPasswordResetEmail(auth, email);
    errorBox.style.color = "#15803d";
    errorBox.textContent =
      "Agar is email par Firebase account hai, to password reset link bhej diya gaya hai. Inbox aur Spam folder check karo.";
  } catch (error) {
    console.error("Password reset failed:", error);
    errorBox.style.color = "#dc2626";

    if (error.code === "auth/invalid-email") {
      errorBox.textContent = "Email address ka format sahi nahi hai.";
    } else if (error.code === "auth/too-many-requests") {
      errorBox.textContent = "Bahut zyada attempts hue hain. Thodi der baad dobara try karo.";
    } else if (error.code === "auth/operation-not-allowed") {
      errorBox.textContent = "Firebase mein Email/Password sign-in enabled hai ya nahi, check karo.";
    } else {
      errorBox.textContent =
        "Reset email nahi bhej paaye: " + (error.code || error.message);
    }
  } finally {
    forgotPasswordBtn.disabled = false;
    forgotPasswordBtn.textContent = "Forgot Password?";
  }
});

loginForm.addEventListener("submit", async event => {
  event.preventDefault();
  errorBox.textContent = "";
  errorBox.style.color = "#dc2626";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    console.error("Login failed:", error);

    if (error.code === "auth/invalid-credential" ||
        error.code === "auth/wrong-password" ||
        error.code === "auth/user-not-found") {
      errorBox.textContent =
        "Email ya password match nahi hua. Email dobara check karo ya Forgot Password use karo.";
    } else if (error.code === "auth/invalid-email") {
      errorBox.textContent = "Email address ka format sahi nahi hai.";
    } else if (error.code === "auth/too-many-requests") {
      errorBox.textContent = "Bahut zyada login attempts hue hain. Thodi der baad try karo.";
    } else if (error.code === "auth/network-request-failed") {
      errorBox.textContent = "Internet connection check karke dobara try karo.";
    } else {
      errorBox.textContent = "Login failed: " + (error.code || error.message);
    }
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});

logoutBtn.addEventListener("click", async () => {
  stopListeners();

  try {
    await signOut(auth);
  } catch (error) {
    showNotice("Logout failed: " + (error.code || error.message));
  }
});

onAuthStateChanged(auth, async user => {
  stopListeners();
  hideNotice();

  if (!user) {
    dashboard.hidden = true;
    loginSection.hidden = false;
    logoutBtn.hidden = true;
    return;
  }

  if (user.uid !== ADMIN_UID) {
    dashboard.hidden = true;
    loginSection.hidden = false;
    logoutBtn.hidden = true;
    errorBox.textContent = "Is account ko Admin access nahi hai.";

    try {
      await signOut(auth);
    } catch (error) {
      console.error("Unauthorized sign-out failed:", error);
    }
    return;
  }

  errorBox.textContent = "";
  loginSection.hidden = true;
  dashboard.hidden = false;
  logoutBtn.hidden = false;

  startJobsListener();
});
</script>
</body>
</html>
